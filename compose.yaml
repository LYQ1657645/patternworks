name: patternworks

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: patternworks-backend:dev
  env_file: ${APP_ENV_FILE:-.env.local}
  environment:
    # Cache eviction must never evict broker queues or task-delivery state.
    CACHE_URL: redis://cache:6379/0
  init: true
  restart: unless-stopped
  volumes:
    - dataset_data:/data/datasets

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: regex
      POSTGRES_USER: regex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regex -d regex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 30 --access-logfile -"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=1", "--events"]
    depends_on:
      backend:
        condition: service_healthy

  flower:
    <<: *backend
    command: ["celery", "-A", "config", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      backend:
        condition: service_healthy

  # Day 1: cleanup also works without Celery Beat. It never logs credentials.
  cleanup:
    <<: *backend
    command: ["sh", "-c", "while true; do python manage.py recover_jobs; python manage.py purge_expired_connections; python manage.py maintain_datasets; sleep 15; done"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  dataset_data:
