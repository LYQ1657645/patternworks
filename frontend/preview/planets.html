<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星球外观对比 · Patternworks</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #e4e9f2; background: #080d18; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(1120px, 100%); margin: auto; padding: 26px 20px 20px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
    h1 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.7px; }
    header span, footer { color: #96a6bf; font-size: 12px; }
    p { margin: 10px 0 24px; color: #b6c3d7; font-size: 14px; }
    .comparison { display: grid; grid-template-columns: 100px repeat(4, 1fr); align-items: center; }
    .heading { text-align: center; padding-bottom: 12px; font-size: 16px; }
    .heading small { display: block; color: #8f9eb5; font-size: 11px; margin-top: 5px; font-weight: 400; }
    .row-label { align-self: stretch; display: flex; flex-direction: column; justify-content: center; border-top: 1px solid #ffffff0d; font-size: 14px; gap: 7px; }
    .row-label span { color: #8f9eb5; font-size: 11px; }
    .planet { margin: 0; display: flex; justify-content: center; border-top: 1px solid #ffffff0d; }
    .planet img { display: block; width: min(100%, 158px); aspect-ratio: 1; object-fit: contain; }
    footer { margin-top: 16px; line-height: 1.6; }
    .overview { display: block; width: 100%; height: auto; }
    .download { display: inline-block; color: #c6d6f2; margin-top: 16px; font-size: 14px; }
    @media (max-width: 600px) { header { display: block; } header span { display: block; margin-top: 8px; } h1 { font-size: 22px; } }
    @media (min-width: 1100px) { .planet img { width: 180px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>四种花纹，四种操作颜色</h1><span>本地外观预览</span></header>
    <p>横向比较花纹，纵向比较同一文件在不同操作后的颜色。</p>
    <div class="comparison" id="comparison"></div>
    <footer>使用当前网页的真实星球材质与光照，静止展示。原始版本稍大并带星环，处理结果稍小。</footer>
  </main>
  <script type="module" src="./planets.ts"></script>
</body>
</html>
