name: Application checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py --staged

  backend:
    runs-on: ubuntu-latest
    env:
      # Pytest's pythonpath setting only changes the driver; Spark launches
      # separate Python workers that also need the application's import root.
      PYTHONPATH: ${{ github.workspace }}/backend
      PYSPARK_PYTHON: python3
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r backend/requirements.lock -r backend/requirements-rules.lock
      - run: python -m pytest -q
      - run: python backend/manage.py check --settings=config.test_settings
      - run: python scripts/init_env.py
      - run: docker compose --env-file .env.local config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
